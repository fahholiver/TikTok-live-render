services:
  - type: web
    name: tiktok-live-reader
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: READER_PASSWORD
        sync: false
      - key: EULERSTREAM_API_KEY
        sync: false
